name: Fetch datasheets

# Manually triggered: downloads every current and archived datasheet revision listed in
# data/families/ (vendor URLs, TI lettered revisions, Internet Archive captures), reads the
# revision printed on each PDF and, optionally, writes the confirmed revisions back into the data.
on:
  workflow_dispatch:
    inputs:
      families:
        description: "Space-separated family ids to fetch (empty = all)"
        required: false
        default: ""
      sources:
        description: "Comma list of sources: direct,ti,wayback"
        required: false
        default: "direct,ti,wayback"
      reconcile:
        description: "Write PDF-confirmed revisions into data/families and regenerate the docs (committed to this branch)"
        type: boolean
        default: true
      commit_pdfs:
        description: "Also commit the PDFs themselves (large; otherwise they are only uploaded as a workflow artifact)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-datasheets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pypdf

      # Keeps CDX responses and already-downloaded PDFs between runs so re-runs resume.
      - uses: actions/cache@v4
        with:
          path: datasheets
          key: datasheets-${{ github.run_id }}
          restore-keys: datasheets-

      - name: Fetch
        env:
          FAMILIES: ${{ inputs.families }}
          SOURCES: ${{ inputs.sources }}
        run: |
          args=(--sources "$SOURCES" --delay 1.5)
          if [ -n "$FAMILIES" ]; then
            read -ra fams <<< "$FAMILIES"
            args+=(--family "${fams[@]}")
          fi
          python tools/fetch_datasheets.py "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: datasheets
          path: |
            datasheets/
            !datasheets/.cache/
          retention-days: 30

      - name: Reconcile revisions into the data
        if: ${{ inputs.reconcile }}
        run: |
          python tools/reconcile_datasheets.py --manifest datasheets/manifest.json
          python tools/build_docs.py
          python -m unittest discover -s tests

      - name: Commit
        if: ${{ inputs.reconcile || inputs.commit_pdfs }}
        env:
          COMMIT_PDFS: ${{ inputs.commit_pdfs }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs README.md datasheets/manifest.json datasheets/INDEX.md
          if [ "$COMMIT_PDFS" = "true" ]; then git add -f datasheets; fi
          git commit -m "Fetch datasheets and confirm revisions from PDFs (run ${{ github.run_id }})" || { echo "nothing new"; exit 0; }
          git push
